<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Dashboard Admin')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>
    <div class="main-content flex-grow-1">
        <div th:replace="~{fragments/layout :: topbar('Dashboard Admin')}"></div>
        <div class="page-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- STATS -->
            <div class="row g-3 mb-4">
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between">
                            <div>
                                <div class="label">Articles total</div>
                                <div class="value" th:text="${totalItems}">0</div>
                            </div>
                            <div class="icon" style="background:#ede9fe;color:#7c3aed"><i class="bi bi-box-seam"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between">
                            <div>
                                <div class="label">Disponibles</div>
                                <div class="value" th:text="${itemsDisponibles}">0</div>
                            </div>
                            <div class="icon" style="background:#dcfce7;color:#16a34a"><i class="bi bi-check-circle"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between">
                            <div>
                                <div class="label">Vendus</div>
                                <div class="value" th:text="${itemsVendus}">0</div>
                            </div>
                            <div class="icon" style="background:#fee2e2;color:#dc2626"><i class="bi bi-cart-check"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between">
                            <div>
                                <div class="label">Utilisateurs</div>
                                <div class="value" th:text="${totalUsers}">0</div>
                            </div>
                            <div class="icon" style="background:#fef3c7;color:#d97706"><i class="bi bi-people"></i></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- DERNIERS ARTICLES -->
                <div class="col-xl-6">
                    <div class="table-card">
                        <div class="px-4 py-3 border-bottom d-flex justify-content-between">
                            <h6 class="fw-bold">📦 Derniers articles</h6>
                            <a href="/admin/articles" class="btn btn-sm btn-outline-primary">Voir tout</a>
                        </div>
                        <table class="table">
                            <thead><tr><th>Titre</th><th>Catégorie</th><th>Prix</th><th>Statut</th></tr></thead>
                            <tbody>
                            <tr th:each="item : ${recentItems}">
                                <td th:text="${item.titre}"></td>
                                <td th:text="${item.categorie.nom}"></td>
                                <td th:text="${item.prix + ' DT'}"></td>
                                <td><span class="badge" th:classappend="${item.statut.toString() == 'DISPONIBLE' ? 'badge-actif' : 'badge-inactif'}" th:text="${item.statut}"></span></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- DERNIÈRES COMMANDES PAYÉES -->
                <div class="col-xl-6">
                    <div class="table-card">
                        <div class="px-4 py-3 border-bottom d-flex justify-content-between">
                            <h6 class="fw-bold">💳 Dernières commandes payées</h6>
                            <a href="/admin/commandes" class="btn btn-sm btn-outline-primary">Voir tout</a>
                        </div>
                        <table class="table">
                            <thead><tr><th>N°</th><th>Acheteur</th><th>Total</th><th>Date</th></tr></thead>
                            <tbody>
                            <tr th:each="cmd : ${recentCommandes}">
                                <td th:text="${cmd.numero}"></td>
                                <td th:text="${cmd.acheteur.prenom + ' ' + cmd.acheteur.nom}"></td>
                                <td th:text="${cmd.montantTotal + ' DT'}"></td>
                                <td th:text="${#temporals.format(cmd.createdAt, 'dd/MM/yyyy')}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <h6>💰 Chiffre d'affaires : <strong th:text="${chiffreAffaires != null ? chiffreAffaires + ' DT' : '0 DT'}"></strong></h6>
            </div>

            <!-- ACTIONS RAPIDES -->
            <div class="mt-4">
                <a href="/admin/categories" class="btn btn-outline-primary me-2">Gérer catégories</a>
                <a href="/admin/utilisateurs" class="btn btn-outline-secondary">Voir utilisateurs</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
