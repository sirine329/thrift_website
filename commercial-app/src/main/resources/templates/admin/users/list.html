<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Utilisateurs')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/layout :: sidebar('users')}"></div>
    <div class="main-content flex-grow-1">
        <div th:replace="~{fragments/layout :: topbar('Gestion des Utilisateurs')}"></div>
        <div class="page-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="fw-700 mb-1">Utilisateurs</h5>
                    <p class="text-muted mb-0 small">Liste des clients enregistrés</p>
                </div>
            </div>

            <div class="table-card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nom complet</th>
                                <th>Email</th>
                                <th>Téléphone</th>
                                <th>Inscrit le</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${users.empty}">
                                <td colspan="7" class="text-center py-5 text-muted">
                                    <i class="bi bi-people fs-1 d-block mb-2 opacity-25"></i>
                                    Aucun utilisateur trouvé
                                </td>
                            </tr>
                            <tr th:each="u, iter : ${users}">
                                <td class="text-muted small" th:text="${iter.index + 1}"></td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div style="width:36px;height:36px;border-radius:50%;background:#ede9fe;color:#7c3aed;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;">
                                            <span th:text="${#strings.substring(u.prenom,0,1)}"></span>
                                        </div>
                                        <div>
                                            <div class="fw-600" th:text="${u.nomComplet}"></div>
                                            <small class="text-muted badge bg-light text-dark">USER</small>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${u.email}">-</td>
                                <td th:text="${u.telephone}">-</td>
                                <td class="text-muted small"
                                    th:text="${#temporals.format(u.createdAt, 'dd/MM/yyyy')}">-</td>
                                <td>
                                    <span th:class="${u.actif ? 'badge badge-actif' : 'badge badge-inactif'} + ' rounded-pill'"
                                          th:text="${u.actif ? 'Actif' : 'Inactif'}"></span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/users/toggle/{id}(id=${u.id})}"
                                       class="btn btn-sm"
                                       th:class="${u.actif ? 'btn btn-sm btn-outline-warning' : 'btn btn-sm btn-outline-success'}"
                                       th:title="${u.actif ? 'Désactiver' : 'Activer'}">
                                        <i th:class="${u.actif ? 'bi bi-person-x' : 'bi bi-person-check'}"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
