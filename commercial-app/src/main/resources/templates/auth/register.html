<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Inscription | ThriftBy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
    <style>
        *{box-sizing:border-box}
        body{min-height:100vh;margin:0;font-family:'DM Sans',sans-serif;background:#f7f8fb;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
        .pattern{position:fixed;width:180px;height:180px;opacity:.95;background:
            radial-gradient(circle at 50% 0,#1DB954 0 34%,transparent 35%),
            radial-gradient(circle at 100% 50%,#1DB954 0 34%,transparent 35%),
            radial-gradient(circle at 50% 100%,#1DB954 0 34%,transparent 35%),
            radial-gradient(circle at 0 50%,#1DB954 0 34%,transparent 35%);filter:saturate(.9)}
        .pattern.top{left:-42px;top:-54px}.pattern.bottom{right:-42px;bottom:-54px}
        .auth-shell{width:min(100%,1040px);min-height:650px;border-radius:18px;position:relative;overflow:hidden;box-shadow:0 34px 80px rgba(13,86,42,.28);background:#0f7f36}
        .auth-bg{position:absolute;inset:0;background:
            linear-gradient(90deg,rgba(8,86,42,.98) 0%,rgba(29,185,84,.84) 38%,rgba(24,108,58,.16) 62%,rgba(6,48,28,.86) 100%),
            url('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1400&q=85') center/cover no-repeat}
        .close-link{position:absolute;right:26px;top:24px;width:34px;height:34px;border:1px solid rgba(255,255,255,.55);border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;z-index:3}
        .brand{position:absolute;top:34px;left:84px;font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:-.04em;z-index:2}
        .shop-menu{position:absolute;left:84px;top:210px;z-index:2}
        .shop-menu h2{font-family:'Syne',sans-serif;font-size:1.35rem;font-weight:800;margin-bottom:14px}
        .shop-menu a{display:block;color:rgba(255,255,255,.72);font-size:.78rem;text-decoration:none;margin:12px 0}
        .shop-menu a.active{color:#fff;font-weight:700}
        .shop-menu a.active:before{content:'';display:inline-block;width:18px;height:1px;background:#fff;margin-right:8px;vertical-align:middle}
        .register-panel{position:absolute;right:32px;top:70px;width:350px;z-index:2}
        .register-panel h1{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;text-transform:uppercase;margin:0}
        .register-panel .welcome{font-size:.9rem;margin:2px 0 14px;color:rgba(255,255,255,.88)}
        .field{height:42px;border-bottom:1px dashed rgba(255,255,255,.42);display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.9);margin-bottom:10px}
        .field i{font-size:.95rem;color:rgba(255,255,255,.7)}
        .field input{width:100%;background:transparent;border:0;outline:0;color:#fff;font-size:.86rem}
        .field input::placeholder{color:rgba(255,255,255,.78)}
        .field .is-invalid{background:transparent}
        .invalid-feedback{font-size:.72rem;color:#ffe4e6;margin-top:-7px;margin-bottom:6px}
        .continue-btn{width:100%;height:38px;border:0;border-radius:999px;background:#fff;color:#0f7f36;font-weight:800;font-size:.84rem;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 12px 24px rgba(6,48,28,.2);margin-top:8px}
        .login-link{display:block;text-align:center;color:#fff;text-decoration:none;font-size:.78rem;margin-top:14px}
        .alert{border-radius:12px;font-size:.82rem;padding:8px 10px;margin-bottom:10px}
        @media (max-width:760px){
            body{padding:14px;overflow:auto}.auth-shell{min-height:800px}.auth-bg{background:linear-gradient(180deg,rgba(8,86,42,.94),rgba(6,48,28,.92)),url('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=900&q=85') center/cover no-repeat}
            .brand{left:28px;top:28px}.shop-menu{left:28px;top:110px}.register-panel{left:24px;right:24px;top:270px;width:auto}.close-link{right:18px;top:18px}
        }
    </style>
</head>
<body>
<div class="pattern top"></div>
<div class="pattern bottom"></div>
<main class="auth-shell">
    <div class="auth-bg"></div>
    <a href="/boutique" class="close-link" aria-label="Fermer"><i class="bi bi-x-lg"></i></a>
    <div class="brand">ThriftBy</div>
    <nav class="shop-menu" aria-label="Categories">
        <h2>Shop</h2>
        <a href="/boutique/shop" class="active">New arrivals</a>
        <a href="/boutique/shop">Women</a>
        <a href="/boutique/shop">Men</a>
        <a href="/boutique/shop">Kids</a>
    </nav>

    <section class="register-panel">
        <h1>New member</h1>
        <p class="welcome">Create your account</p>

        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post" novalidate>
            <label class="field">
                <i class="bi bi-person"></i>
                <input type="text" th:field="*{prenom}" th:classappend="${#fields.hasErrors('prenom') ? 'is-invalid' : ''}" placeholder="Prenom"/>
            </label>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>

            <label class="field">
                <i class="bi bi-person-badge"></i>
                <input type="text" th:field="*{nom}" th:classappend="${#fields.hasErrors('nom') ? 'is-invalid' : ''}" placeholder="Nom"/>
            </label>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>

            <label class="field">
                <i class="bi bi-envelope"></i>
                <input type="email" th:field="*{email}" th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}" placeholder="email@example.com"/>
            </label>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label class="field">
                <i class="bi bi-telephone"></i>
                <input type="text" th:field="*{telephone}" placeholder="Telephone"/>
            </label>

            <label class="field">
                <i class="bi bi-lock"></i>
                <input type="password" th:field="*{password}" th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}" placeholder="Password"/>
            </label>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <button type="submit" class="continue-btn">
                <span>Create account</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <a href="/login" class="login-link">Already have account? Login Now</a>
    </section>
</main>
</body>
</html>
