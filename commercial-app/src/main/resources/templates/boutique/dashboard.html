<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mon Profil – ThriftBy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="/">🛍️ ThriftBy</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/boutique/shop">Catalogue</a>
      <a class="nav-link" href="/panier">Panier</a>
      <a class="nav-link active" href="/profil">Profil</a>
      <form th:action="@{/logout}" method="post" style="display:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="nav-link" style="background:none; border:none; cursor:pointer">Déconnexion</button>
      </form>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h1>Mon Profil</h1>
  <div class="card p-3 mb-4">
    <p><strong>Nom :</strong> <span th:text="${user.nom}"></span></p>
    <p><strong>Prénom :</strong> <span th:text="${user.prenom}"></span></p>
    <p><strong>Email :</strong> <span th:text="${user.email}"></span></p>
    <a href="/profil/edit" class="btn btn-primary">Modifier mon profil</a>
  </div>
  <a href="/profil/commandes" class="btn btn-outline-secondary">Mes commandes</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
