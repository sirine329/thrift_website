<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Catalogue | CommercialApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        :root { --primary: #4f46e5; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .navbar-custom { background: #fff; border-bottom: 1px solid #e2e8f0; }
        .navbar-brand { font-weight: 800; color: var(--primary) !important; }
        .nav-link { font-weight: 500; color: #374151 !important; }
        .nav-link:hover { color: var(--primary) !important; }

        .page-header {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #fff; padding: 2.5rem 0;
        }
        .page-header h1 { font-weight: 800; font-size: 2rem; }

        .sidebar-filter {
            background: #fff;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            padding: 1.25rem;
        }
        .sidebar-filter h6 { font-weight: 700; color: #0f172a; font-size: .9rem; text-transform: uppercase; letter-spacing: .05em; }
        .filter-item {
            display: block;
            padding: .5rem .75rem;
            border-radius: 8px;
            color: #374151;
            font-size: .875rem;
            font-weight: 500;
            text-decoration: none;
            transition: all .15s;
        }
        .filter-item:hover, .filter-item.active {
            background: #ede9fe;
            color: var(--primary);
        }

        .search-bar .form-control {
            border-radius: 10px 0 0 10px;
            border-right: none;
            padding: .65rem 1rem;
        }
        .search-bar .btn { border-radius: 0 10px 10px 0; }

        .product-card {
            background: #fff;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            transition: transform .2s, box-shadow .2s;
            height: 100%;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.1); }
        .product-img {
            height: 160px;
            background: linear-gradient(135deg, #ede9fe, #dbeafe);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; color: var(--primary);
        }
        .product-body { padding: 1rem; }
        .badge-cat { background: #ede9fe; color: var(--primary); font-size: .7rem; font-weight: 600; }
        .product-price { font-weight: 800; font-size: 1.2rem; color: #0f172a; }
        .btn-detail {
            background: var(--primary); color: #fff; border: none;
            border-radius: 8px; padding: .4rem 1rem; font-weight: 600;
            font-size: .82rem; transition: all .2s;
        }
        .btn-detail:hover { background: #3730a3; color: #fff; }
        .badge-actif   { background: #dcfce7; color: #166534; }
        .badge-bas     { background: #fef3c7; color: #92400e; }
        footer { background: #0f172a; color: rgba(255,255,255,.5); padding: 2rem 0; margin-top: 4rem; font-size: .875rem; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/user/home">
            <i class="bi bi-bag-heart-fill me-2"></i>CommercialApp
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto ms-4">
                <li class="nav-item"><a class="nav-link" href="/user/home">Accueil</a></li>
                <li class="nav-item"><a class="nav-link active" href="/user/products">Catalogue</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <a sec:authorize="hasAnyRole('ADMIN','SUPERADMIN')"
                   href="/admin/dashboard" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-speedometer2 me-1"></i>Admin
                </a>
                <form th:action="@{/logout}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
    <div class="container">
        <h1><i class="bi bi-grid me-3"></i>Catalogue</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0" style="--bs-breadcrumb-item-active-color: rgba(255,255,255,.7)">
                <li class="breadcrumb-item"><a href="/user/home" style="color:rgba(255,255,255,.6);">Accueil</a></li>
                <li class="breadcrumb-item active">Catalogue</li>
            </ol>
        </nav>
    </div>
</div>

<div class="container py-5">
    <div class="row g-4">

        <!-- SIDEBAR -->
        <div class="col-lg-3">
            <div class="sidebar-filter mb-4">
                <h6 class="mb-3"><i class="bi bi-funnel me-2"></i>Catégories</h6>
                <a href="/user/products"
                   th:classappend="${categorieId == null ? ' active' : ''}"
                   class="filter-item">
                    <i class="bi bi-grid-3x3-gap me-2"></i>Tous les produits
                </a>
                <a th:each="c : ${categories}"
                   th:href="@{/user/products(categorieId=${c.id})}"
                   th:classappend="${categorieId == c.id ? ' active' : ''}"
                   class="filter-item"
                   th:text="${c.nom}">
                </a>
            </div>
        </div>

        <!-- PRODUCTS -->
        <div class="col-lg-9">
            <!-- SEARCH -->
            <div class="input-group search-bar mb-4">
                <form th:action="@{/user/products}" method="get" class="input-group w-100">
                    <input type="text" name="search" th:value="${search}"
                           class="form-control" placeholder="Rechercher un produit..."/>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-search"></i>
                    </button>
                    <a href="/user/products" class="btn btn-outline-secondary">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </form>
            </div>

            <!-- RESULTS COUNT -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <p class="text-muted small mb-0">
                    <strong th:text="${products.size()}">0</strong> produit(s) trouvé(s)
                </p>
            </div>

            <!-- GRID -->
            <div class="row g-3">
                <div th:if="${products.empty}" class="col-12 text-center py-5 text-muted">
                    <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
                    <p>Aucun produit trouvé.</p>
                    <a href="/user/products" class="btn btn-outline-primary btn-sm">Voir tout le catalogue</a>
                </div>
                <div th:each="p : ${products}" class="col-sm-6 col-xl-4">
                    <div class="product-card">
                        <div class="product-img">
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <div class="product-body">
                            <span class="badge badge-cat rounded-pill mb-2" th:text="${p.categorie.nom}"></span>
                            <div class="fw-700 mb-1" style="font-size:.95rem;" th:text="${p.nom}"></div>
                            <p class="text-muted small mb-2"
                               th:text="${p.description != null ? #strings.abbreviate(p.description, 60) : ''}"></p>
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <div class="product-price" th:text="${#numbers.formatDecimal(p.prix,1,2)} + ' DT'"></div>
                                <span th:class="${p.stockBas ? 'badge badge-bas' : 'badge badge-actif'}"
                                      th:text="${p.stock > 0 ? p.stock + ' en stock' : 'Rupture'}"></span>
                            </div>
                            <a th:href="@{/user/products/{id}(id=${p.id})}" class="btn btn-detail w-100">
                                <i class="bi bi-eye me-2"></i>Voir détails
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    <div class="container text-center">
        <p class="mb-0">© 2024 CommercialApp — Tous droits réservés</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
