# =========================================
# ThriftBy — Application Configuration
# =========================================

spring.application.name=thriftby

server.port=8081 

# --- Base de données MySQL via XAMPP ---
spring.datasource.url=jdbc:mysql://localhost:3306/thriftby_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# --- Upload fichiers (photos articles) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# --- Stripe ---
stripe.api.key=sk_test_VOTRE_CLE_STRIPE
stripe.webhook.secret=whsec_VOTRE_WEBHOOK_SECRET
stripe.success.url=http://localhost:8081/commande/success
stripe.cancel.url=http://localhost:8081/panier

# --- Email ---
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Email (Resend) ---
resend.api.key=re_VOTRE_CLE_RESEND
resend.from=ThriftBy <noreply@thriftby.tn>

# --- Application ---
app.base-url=http://localhost:8081
app.commission=0.05
app.frais-livraison=7.00
app.upload-dir=uploads

# --- Logging ---
logging.level.com.thriftby=INFO
logging.level.org.springframework.security=WARN

# ===== JWT =====
app.jwt.secret=thriftby-super-secret-key-change-in-production-must-be-256bits-long
app.jwt.expiration-ms=86400000