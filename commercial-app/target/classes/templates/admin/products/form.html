<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Produit')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/layout :: sidebar('products')}"></div>
    <div class="main-content flex-grow-1">
        <div th:replace="~{fragments/layout :: topbar('Gestion des Produits')}"></div>
        <div class="page-content">

            <!-- BREADCRUMB -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin/dashboard">Dashboard</a></li>
                    <li class="breadcrumb-item"><a href="/admin/products">Produits</a></li>
                    <li class="breadcrumb-item active"
                        th:text="${product.id != null ? 'Modifier' : 'Nouveau'}"></li>
                </ol>
            </nav>

            <div class="form-card">
                <h5 class="fw-700 mb-4">
                    <i class="bi bi-box-seam me-2 text-primary"></i>
                    <span th:text="${product.id != null ? 'Modifier le produit' : 'Nouveau produit'}"></span>
                </h5>

                <!-- NEW -->
                <form th:if="${product.id == null}"
                      th:action="@{/admin/products/save}"
                      th:object="${product}" method="post" novalidate>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nom du produit *</label>
                            <input type="text" th:field="*{nom}" class="form-control"
                                   th:classappend="${#fields.hasErrors('nom') ? 'is-invalid' : ''}"
                                   placeholder="Nom du produit"/>
                            <div class="invalid-feedback" th:errors="*{nom}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Référence</label>
                            <input type="text" th:field="*{reference}" class="form-control"
                                   placeholder="Auto-générée si vide"/>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"
                                      placeholder="Description du produit..."></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Prix de vente (DT) *</label>
                            <input type="number" th:field="*{prix}" class="form-control"
                                   th:classappend="${#fields.hasErrors('prix') ? 'is-invalid' : ''}"
                                   step="0.01" min="0" placeholder="0.00"/>
                            <div class="invalid-feedback" th:errors="*{prix}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Prix d'achat (DT)</label>
                            <input type="number" th:field="*{prixAchat}" class="form-control"
                                   step="0.01" min="0" placeholder="0.00"/>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Stock *</label>
                            <input type="number" th:field="*{stock}" class="form-control"
                                   th:classappend="${#fields.hasErrors('stock') ? 'is-invalid' : ''}"
                                   min="0" placeholder="0"/>
                            <div class="invalid-feedback" th:errors="*{stock}"></div>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Stock min</label>
                            <input type="number" th:field="*{stockMin}" class="form-control" min="0" placeholder="5"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Catégorie *</label>
                            <select name="categorieId" class="form-select" required>
                                <option value="">-- Choisir --</option>
                                <option th:each="c : ${categories}"
                                        th:value="${c.id}"
                                        th:text="${c.nom}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fournisseur *</label>
                            <select name="fournisseurId" class="form-select" required>
                                <option value="">-- Choisir --</option>
                                <option th:each="f : ${fournisseurs}"
                                        th:value="${f.id}"
                                        th:text="${f.nom}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-2"></i>Enregistrer
                        </button>
                        <a href="/admin/products" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>

                <!-- EDIT -->
                <form th:if="${product.id != null}"
                      th:action="@{/admin/products/update}"
                      th:object="${product}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}"/>
                    <input type="hidden" th:field="*{reference}"/>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nom du produit *</label>
                            <input type="text" th:field="*{nom}" class="form-control"
                                   th:classappend="${#fields.hasErrors('nom') ? 'is-invalid' : ''}"/>
                            <div class="invalid-feedback" th:errors="*{nom}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Référence</label>
                            <input type="text" th:value="${product.reference}" class="form-control" disabled/>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Prix de vente (DT) *</label>
                            <input type="number" th:field="*{prix}" class="form-control" step="0.01" min="0"/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Prix d'achat (DT)</label>
                            <input type="number" th:field="*{prixAchat}" class="form-control" step="0.01" min="0"/>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Stock *</label>
                            <input type="number" th:field="*{stock}" class="form-control" min="0"/>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Stock min</label>
                            <input type="number" th:field="*{stockMin}" class="form-control" min="0"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Catégorie *</label>
                            <select name="categorieId" class="form-select">
                                <option th:each="c : ${categories}"
                                        th:value="${c.id}"
                                        th:text="${c.nom}"
                                        th:selected="${c.id == product.categorie?.id}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fournisseur *</label>
                            <select name="fournisseurId" class="form-select">
                                <option th:each="f : ${fournisseurs}"
                                        th:value="${f.id}"
                                        th:text="${f.nom}"
                                        th:selected="${f.id == product.fournisseur?.id}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Statut</label>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox"
                                       th:field="*{actif}" role="switch"/>
                                <label class="form-check-label">Actif</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-2"></i>Mettre à jour
                        </button>
                        <a href="/admin/products" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
