<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Paiement | ThriftBy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f7fafc; color: #111827; margin: 0; padding: 0; }
        .page { max-width: 1040px; margin: 2rem auto; padding: 0 1rem; }
        .topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
        .brand { text-decoration: none; color: #1d4ed8; font-size: 1.35rem; font-weight: 800; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 18px; box-shadow: 0 20px 60px rgba(15,23,42,.05); padding: 1.5rem; }
        .section-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem; }
        .order-row { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; }
        .fieldset { margin-bottom: 1.5rem; padding: 1rem; border: 1px solid #e5e7eb; border-radius: 14px; }
        .field-label { display: block; font-weight: 600; margin-bottom: .5rem; }
        .form-control, .form-check-input { border-radius: 12px; }
        .form-select { border-radius: 12px; }
        .btn-primary { border-radius: 12px; padding: .85rem 1.25rem; }
        .item-card { display: grid; grid-template-columns: 72px 1fr 120px; gap: 1rem; align-items: center; border-bottom: 1px solid #e5e7eb; padding: .95rem 0; }
        .item-card:last-child { border-bottom: none; }
        .item-image { width: 72px; height: 72px; border-radius: 14px; background: #f3f4f6; display: grid; place-items: center; overflow: hidden; }
        .item-image img { width: 100%; height: 100%; object-fit: cover; }
        .badge-pill { background: #e0f2fe; color: #0369a1; border-radius: 999px; padding: .4rem .8rem; font-size: .8rem; }
        .alert { border-radius: 12px; }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <a href="/boutique" class="brand">ThriftBy</a>
        <a href="/panier" class="btn btn-outline-secondary">Retourner au panier</a>
    </div>

    <div class="card">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

        <h2 class="section-title">Passer commande</h2>
        <form th:action="@{/commande/checkout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="order-row">
                <div>
                    <div class="fieldset">
                        <label class="field-label" for="adresseLivraison">Adresse de livraison</label>
                        <textarea id="adresseLivraison" name="adresseLivraison" class="form-control" rows="4" placeholder="Rue, appartement, ville, code postal"></textarea>
                    </div>

                    <div class="fieldset">
                        <span class="field-label">Mode de paiement</span>
                        <div th:each="mode : ${modesPaiement}" class="form-check mb-2">
                            <input class="form-check-input" type="radio" th:id="${mode.name()}" name="modePaiement"
                                   th:value="${mode.name()}" th:checked="${mode.name()} == 'ESPECE_EN_LIVRAISON'"/>
                            <label class="form-check-label" th:for="${mode.name()}" th:text="${mode.libelle}"></label>
                        </div>
                        <p class="text-muted" style="font-size:.9rem; margin-top:.75rem;">La livraison est organisée en Tunisie. Vous pouvez régler à la livraison ou choisir le paiement en ligne.</p>
                    </div>
                </div>

                <div>
                    <h3 class="section-title">Résumé de commande</h3>
                    <div class="mb-4" th:each="item : ${panier.items}">
                        <div class="item-card">
                            <div class="item-image">
                                <img th:if="${item.photoUrl != null}" th:src="${item.photoUrl}" th:alt="${item.titre}"/>
                                <span th:if="${item.photoUrl == null}" th:text="${item.categorie?.icone ?: '🛍️'}"></span>
                            </div>
                            <div>
                                <div style="font-weight:700;" th:text="${item.titre}"></div>
                                <div class="text-muted" th:text="${item.vendeur?.prenom + ' ' + item.vendeur?.nom}"></div>
                            </div>
                            <div style="text-align:right; font-weight:700;" th:text="${item.prix + ' DT'}"></div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <div class="d-flex justify-content-between mb-2"><span>Total des articles</span><strong th:text="${panier.total + ' DT'}"></strong></div>
                        <div class="d-flex justify-content-between mb-2"><span>Commission plateforme</span><strong th:text="${panier.fraisPlateforme + ' DT'}"></strong></div>
                        <div class="d-flex justify-content-between mb-2"><span>Frais de livraison</span><strong th:text="${panier.fraisLivraison + ' DT'}"></strong></div>
                        <hr/>
                        <div class="d-flex justify-content-between" style="font-size:1.1rem;font-weight:700;"><span>Total</span><strong th:text="${panier.totalFinal + ' DT'}"></strong></div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary mt-3">Confirmer la commande</button>
        </form>
    </div>
</div>

<script>
    document.querySelector('form')?.addEventListener('submit', function (event) {
        const address = document.getElementById('adresseLivraison').value;
        if (!address || !address.trim()) {
            event.preventDefault();
            alert('Veuillez saisir une adresse de livraison.');
        }
    });
</script>
</body>
</html>
