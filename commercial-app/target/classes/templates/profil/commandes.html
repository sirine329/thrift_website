<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mes commandes | ThriftBy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #111827; margin: 0; }
        .page { max-width: 1040px; margin: 2rem auto; padding: 0 1rem; }
        .header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
        .title { margin: 0; font-size: 1.6rem; font-weight: 800; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 18px; padding: 1.5rem; box-shadow: 0 20px 60px rgba(15,23,42,.04); }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 1rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
        .status-badge { display: inline-flex; align-items: center; gap: .4rem; padding: .35rem .7rem; border-radius: 999px; font-size: .85rem; }
        .STATUS_EN_ATTENTE { background: #fef9c3; color: #92400e; }
        .STATUS_PAYEE { background: #d1fae5; color: #166534; }
        .STATUS_EXPEDIEE { background: #dbebff; color: #1d4ed8; }
        .STATUS_LIVREE { background: #d1fae5; color: #166534; }
        .STATUS_ANNULEE { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <div>
            <h1 class="title">Mes commandes</h1>
            <p class="text-muted">Consultez l'historique de vos achats et le mode de paiement choisi.</p>
        </div>
        <a href="/profil" class="btn btn-outline-secondary">Retour au profil</a>
    </div>

    <div class="card">
        <div th:if="${commandes == null || #lists.isEmpty(commandes)}" class="text-center py-5">
            <h4>Aucune commande pour le moment.</h4>
            <p class="text-muted">Ajoutez des articles à votre panier et passez commande.</p>
            <a href="/boutique/shop" class="btn btn-primary">Voir le catalogue</a>
        </div>

        <div th:if="${commandes != null && !#lists.isEmpty(commandes)}">
            <table class="table">
                <thead>
                    <tr>
                        <th>Numéro</th>
                        <th>Article</th>
                        <th>Montant</th>
                        <th>Mode de paiement</th>
                        <th>Statut</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="commande : ${commandes}">
                        <td th:text="${commande.numero}"></td>
                        <td>
                            <strong th:text="${commande.item.titre}"></strong><br/>
                            <span class="text-muted" th:text="${commande.item.vendeur.prenom + ' ' + commande.item.vendeur.nom}"></span>
                        </td>
                        <td th:text="${commande.montantTotal + ' DT'}"></td>
                        <td th:text="${commande.modePaiement != null ? commande.modePaiement.libelle : 'Mode non défini'}"></td>
                        <td>
                            <span th:classappend="' status-badge STATUS_' + commande.statut.name()"
                                  th:text="${commande.statut.name().replace('_', ' ')}"></span>
                        </td>
                        <td th:text="${#dates.format(commande.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
