<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le profil - ThriftBy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{--green:#1DB954;--green-dark:#0f7f36;--text:#172033;--muted:#6B7280;--border:#E5E7EB;--bg:#F7F8FA;--shadow:0 2px 14px rgba(15,23,42,.07)}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
        h1,.brand{font-family:'Syne',sans-serif}
        .tb-nav{height:62px;background:#fff;border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;position:sticky;top:0;z-index:20;box-shadow:0 1px 8px rgba(0,0,0,.04)}
        .brand{color:var(--green);font-size:1.55rem;font-weight:800;text-decoration:none;margin-right:28px}
        .tb-search{position:relative;max-width:440px;flex:1}
        .tb-search input{width:100%;border:1px solid var(--border);border-radius:999px;background:#f8fafc;padding:9px 16px 9px 40px;font-size:.88rem;outline:none}
        .tb-search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
        .nav-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
        .nav-lk{border:0;background:transparent;color:var(--muted);text-decoration:none;font-size:.87rem;font-weight:600;padding:8px 12px;border-radius:9px;display:flex;align-items:center;gap:6px}
        .nav-lk:hover{background:#f3f4f6;color:var(--text)}
        .btn-sell{background:var(--green);color:#fff;text-decoration:none;border-radius:999px;padding:9px 18px;font-weight:800;font-size:.86rem;display:flex;align-items:center;gap:6px}
        .wrap{max-width:760px;margin:28px auto 54px;padding:0 18px}
        .panel{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
        .panel-head{padding:24px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:18px}
        .panel-head h1{font-size:1.45rem;font-weight:800;margin:0}
        .back-link{color:var(--green);text-decoration:none;font-weight:800;font-size:.9rem;white-space:nowrap}
        .form-body{padding:26px 28px}
        .form-label{font-weight:800;font-size:.88rem;color:var(--text)}
        .form-control{border-color:var(--border);border-radius:10px;padding:10px 12px}
        .form-control:focus{border-color:var(--green);box-shadow:0 0 0 .2rem rgba(29,185,84,.14)}
        .hint{color:var(--muted);font-size:.82rem;margin-top:6px}
        .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
        .btn-cancel{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:999px;padding:10px 18px;font-weight:800;text-decoration:none}
        .btn-save{border:0;background:var(--green);color:#fff;border-radius:999px;padding:10px 20px;font-weight:800}
        .btn-save:hover{background:var(--green-dark)}
        @media (max-width:760px){.tb-search{display:none}.nav-lk span{display:none}.panel-head{align-items:flex-start;flex-direction:column}.actions{flex-direction:column-reverse}.btn-cancel,.btn-save{width:100%;text-align:center}.form-body,.panel-head{padding:22px}}
    </style>
</head>
<body>
<nav class="tb-nav">
    <a href="/boutique" class="brand">ThriftBy</a>
    <form class="tb-search" action="/boutique/shop" method="get">
        <i class="bi bi-search"></i>
        <input type="text" name="q" placeholder="Rechercher...">
    </form>
    <div class="nav-actions">
        <a href="/boutique/shop" class="nav-lk"><i class="bi bi-grid"></i><span>Catalogue</span></a>
        <a href="/panier" class="nav-lk"><i class="bi bi-bag"></i><span>Panier</span></a>
        <a href="/profil" class="nav-lk" style="color:var(--green)"><i class="bi bi-person"></i><span>Profil</span></a>
        <form th:action="@{/logout}" method="post" style="display:inline;margin:0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="nav-lk"><i class="bi bi-box-arrow-right"></i></button>
        </form>
        <a href="/vendeur/publier" class="btn-sell"><i class="bi bi-plus-lg"></i> Vendre</a>
    </div>
</nav>

<main class="wrap">
    <section class="panel">
        <div class="panel-head">
            <h1>Modifier le profil</h1>
            <a href="/profil" class="back-link"><i class="bi bi-arrow-left"></i> Retour au profil</a>
        </div>

        <form th:action="@{/profil/edit}" th:object="${user}" method="post" class="form-body">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="prenom" class="form-label">Prenom</label>
                    <input type="text" id="prenom" th:field="*{prenom}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="nom" class="form-label">Nom</label>
                    <input type="text" id="nom" th:field="*{nom}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="telephone" class="form-label">Telephone</label>
                    <input type="tel" id="telephone" th:field="*{telephone}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label for="ville" class="form-label">Ville</label>
                    <input type="text" id="ville" th:field="*{ville}" class="form-control">
                </div>
                <div class="col-12">
                    <label for="bio" class="form-label">Bio</label>
                    <textarea id="bio" th:field="*{bio}" class="form-control" rows="5" maxlength="500"></textarea>
                    <div class="hint">Maximum 500 caracteres.</div>
                </div>
            </div>

            <div class="actions">
                <a href="/profil" class="btn-cancel">Annuler</a>
                <button type="submit" class="btn-save"><i class="bi bi-check2"></i> Enregistrer</button>
            </div>
        </form>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
