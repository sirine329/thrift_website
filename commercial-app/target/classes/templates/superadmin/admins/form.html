<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Modifier Admin')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/layout :: sidebar('admins')}"></div>
    <div class="main-content flex-grow-1">
        <div th:replace="~{fragments/layout :: topbar('Modifier Administrateur')}"></div>
        <div class="page-content">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/superadmin/dashboard">Dashboard</a></li>
                    <li class="breadcrumb-item"><a href="/superadmin/admins">Administrateurs</a></li>
                    <li class="breadcrumb-item active">Modifier</li>
                </ol>
            </nav>

            <div class="form-card" style="max-width: 600px; border-top: 3px solid #dc2626;">
                <h5 class="fw-700 mb-4">
                    <i class="bi bi-shield-check me-2 text-danger"></i>
                    Modifier l'administrateur
                </h5>
                <form th:action="@{/superadmin/admins/update}"
                      th:object="${admin}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}"/>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Prénom *</label>
                            <input type="text" th:field="*{prenom}" class="form-control"
                                   th:classappend="${#fields.hasErrors('prenom') ? 'is-invalid' : ''}"/>
                            <div class="invalid-feedback" th:errors="*{prenom}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nom *</label>
                            <input type="text" th:field="*{nom}" class="form-control"
                                   th:classappend="${#fields.hasErrors('nom') ? 'is-invalid' : ''}"/>
                            <div class="invalid-feedback" th:errors="*{nom}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" readonly
                                   style="background:#f8fafc;"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Téléphone</label>
                            <input type="text" th:field="*{telephone}" class="form-control"/>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Nouveau mot de passe <small class="text-muted">(laisser vide pour conserver)</small></label>
                            <input type="password" th:field="*{password}" class="form-control"
                                   placeholder="Nouveau mot de passe..."/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Statut</label>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox"
                                       th:field="*{actif}" role="switch"/>
                                <label class="form-check-label">Actif</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-save me-2"></i>Mettre à jour
                        </button>
                        <a href="/superadmin/admins" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
