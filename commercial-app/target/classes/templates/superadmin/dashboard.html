<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('SuperAdmin Dashboard')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>
    <div class="main-content flex-grow-1">
        <div th:replace="~{fragments/layout :: topbar('Super Admin Dashboard')}"></div>
        <div class="page-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- STATS -->
            <div class="row g-3 mb-4">
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="label mb-1">Total Utilisateurs</div>
                                <div class="value" th:text="${totalUsers}">0</div>
                                <small class="text-success"><span th:text="${totalActifs}"></span> actifs</small>
                            </div>
                            <div class="icon" style="background:#ede9fe;color:#7c3aed"><i class="bi bi-people"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="label mb-1">Vendeurs</div>
                                <div class="value" th:text="${totalVendeurs}">0</div>
                            </div>
                            <div class="icon" style="background:#dbeafe;color:#2563eb"><i class="bi bi-shop"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="label mb-1">Administrateurs</div>
                                <div class="value" th:text="${totalAdmins}">0</div>
                            </div>
                            <div class="icon" style="background:#dcfce7;color:#16a34a"><i class="bi bi-shield-check"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="label mb-1">Actifs</div>
                                <div class="value" th:text="${totalActifs}">0</div>
                            </div>
                            <div class="icon" style="background:#fef3c7;color:#d97706"><i class="bi bi-check-circle"></i></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- TOP VENDEURS -->
                <div class="col-xl-6">
                    <div class="table-card">
                        <div class="px-4 py-3 border-bottom d-flex justify-content-between">
                            <h6 class="mb-0 fw-bold">🏆 Top Vendeurs</h6>
                            <a href="/superadmin/users" class="btn btn-sm btn-outline-primary">Voir tout</a>
                        </div>
                        <table class="table">
                            <thead><tr><th>Vendeur</th><th>Email</th><th>Ventes</th></tr></thead>
                            <tbody>
                            <tr th:if="${topVendeurs.empty}">
                                <td colspan="3" class="text-center py-4 text-muted">Aucun vendeur avec article pour le moment</td>
                            </tr>
                            <tr th:each="v : ${topVendeurs}">
                                <td th:text="${v.nom}"></td>
                                <td th:text="${v.email}"></td>
                                <td th:text="${v.nbVentes}">0</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- CHIFFRE AFFAIRES + STATS -->
                <div class="col-xl-6">
                    <div class="form-card text-center p-4">
                        <h6>💰 Chiffre d'affaires total</h6>
                        <h3 class="fw-bold text-success" th:text="${chiffreAffaires != null ? chiffreAffaires + ' DT' : '0 DT'}"></h3>
                        <hr>
                        <div class="row">
                            <div class="col"><strong>Articles</strong><br><span th:text="${totalItems}">0</span></div>
                            <div class="col"><strong>Vendus</strong><br><span th:text="${totalVendus}">0</span></div>
                            <div class="col"><strong>Catégories</strong><br><span th:text="${totalCategories}">0</span></div>
                            <div class="col"><strong>Commandes</strong><br><span th:text="${totalCommandes}">0</span></div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <a href="/superadmin/admins" class="btn btn-outline-danger me-2">Gérer les admins</a>
                        <a href="/superadmin/users" class="btn btn-outline-secondary">Tous les utilisateurs</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
